<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino Semanal</title>

<meta name="theme-color" content="#1c1a17">
<link rel="icon" type="image/png" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /*
    App de acompanhamento de treino + bioimpedância (v2 — simplificada).
    O planejamento de exercícios/séries/cargas agora fica no app da personal.
    Aqui a gente só registra: em que dia foi à academia, qual grupo muscular
    ou aeróbico fez, e a evolução de peso/medidas.
  */
  :root {
    --bg: #1c1a17;
    --surface: #27241e;
    --surface-2: #322e26;
    --fg: #f1ece3;
    --muted: #9c9284;
    --line: #3a352c;
    --accent: #e8542c;
    --accent-ink: #fff2ec;
    --cardio: #3f9e8f;
    --cardio-ink: #eafaf7;
    --danger: #cf4536;
    --danger-ink: #fff2f0;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    font-family: "Work Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .display {
    font-family: "Barlow Condensed", system-ui, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    text-wrap: balance;
  }

  button { font-family: inherit; }

  /* ---------- Shell ---------- */

  .app {
    max-width: 920px;
    margin: 0 auto;
    padding-left: calc(16px + env(safe-area-inset-left));
    padding-right: calc(16px + env(safe-area-inset-right));
    padding-top: calc(18px + env(safe-area-inset-top));
    padding-bottom: calc(48px + env(safe-area-inset-bottom));
  }

  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .topbar .wordmark { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.04em; color: var(--fg); }
  .topbar .wordmark span { color: var(--accent); }

  .edit-link {
    font-size: 0.78rem;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 7px 13px;
    border-radius: 999px;
    white-space: nowrap;
    background: none;
    cursor: pointer;
  }
  .edit-link:hover { color: var(--fg); border-color: var(--muted); }
  .edit-link.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  /* ---------- Week nav ---------- */

  .week-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .week-nav .week-label { font-size: 0.82rem; color: var(--muted); text-align: center; flex: 1; }
  .week-nav button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 0.95rem; cursor: pointer; flex: 0 0 auto; }
  .week-nav button:disabled { opacity: 0.35; cursor: default; }

  .day-rail { display: flex; gap: 8px; overflow-x: auto; padding-block: 4px 6px; margin-bottom: 20px; scrollbar-width: none; }
  .day-rail::-webkit-scrollbar { display: none; }

  .day-pill {
    flex: 1 1 0;
    min-width: 46px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding-block: 10px 8px;
    border-radius: 14px; border: 1px solid var(--line);
    background: var(--surface); color: var(--muted); cursor: pointer;
  }
  .day-pill .dow { font-family: "Barlow Condensed", sans-serif; font-size: 0.86rem; font-weight: 700; letter-spacing: 0.03em; color: inherit; }
  .day-pill .dnum { font-size: 0.64rem; color: inherit; opacity: 0.85; }
  .day-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .day-pill[data-kind="forca"] .dot { background: var(--accent); }
  .day-pill[data-kind="cardio"] .dot { background: var(--cardio); }
  .day-pill[data-future="true"] { opacity: 0.4; cursor: default; }
  .day-pill[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .day-pill[aria-selected="true"] .dot { background: var(--accent-ink); }
  .day-pill[data-kind="cardio"][aria-selected="true"] { background: var(--cardio); border-color: var(--cardio); color: var(--cardio-ink); }
  .day-pill[data-kind="cardio"][aria-selected="true"] .dot { background: var(--cardio-ink); }

  /* ---------- Stats row ---------- */

  .stats-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .stats-row > div { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; }
  .stat-num { font-family: "Barlow Condensed", sans-serif; font-size: 1.5rem; font-weight: 700; }
  .stat-lbl { font-size: 0.66rem; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; margin-top: 2px; }

  /* ---------- Day panel ---------- */

  .workout-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .workout-head h1 { font-size: clamp(1.5rem, 5vw, 2rem); margin: 0 0 2px; line-height: 1; }
  .workout-head .meta { font-size: 0.85rem; color: var(--muted); }
  .badge {
    font-family: "Barlow Condensed", sans-serif; font-size: 0.78rem; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; border: 1px solid currentColor;
  }
  .badge.forca { color: var(--accent); }
  .badge.cardio { color: var(--cardio); }
  .badge.descanso { color: var(--muted); }

  .rest-card { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 30px 20px; text-align: center; color: var(--muted); }
  .rest-card .display { color: var(--fg); font-size: 1.2rem; margin-bottom: 6px; }

  .checkin-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
    border-radius: 999px; padding: 8px 14px; font-size: 0.84rem; cursor: pointer; user-select: none;
  }
  .chip.selected { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip.cardio-chip.selected { background: var(--cardio); border-color: var(--cardio); color: var(--cardio-ink); }
  .form-row { display: flex; flex-direction: column; gap: 5px; }
  .form-row label { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
  .form-row input[type="text"], .form-row input[type="number"], .form-row input[type="date"], textarea {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; color: var(--fg);
    padding: 10px 12px; font-size: 0.9rem; font-family: inherit; width: 100%;
  }
  textarea { resize: vertical; min-height: 56px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .btn-small { border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 10px; padding: 9px 14px; font-size: 0.84rem; cursor: pointer; font-weight: 600; }
  .btn-small.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-small.danger { color: var(--danger); border-color: var(--danger); }
  .link-btn { background: none; border: none; color: var(--accent); font-size: 0.82rem; cursor: pointer; padding: 0; text-decoration: underline; }
  .hint { font-size: 0.74rem; color: var(--muted); line-height: 1.4; }

  .checkin-view { display: flex; flex-direction: column; gap: 8px; }
  .checkin-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-pill { font-size: 0.76rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); background: var(--surface-2); }
  .checkin-note { font-size: 0.86rem; color: var(--fg); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
  .checkin-meta-row { font-size: 0.78rem; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }

  /* ---------- Histórico de check-ins ---------- */

  .section-label { font-size: 0.8rem; color: var(--muted); font-weight: 600; margin: 22px 0 10px; }
  .hist-list { display: flex; flex-direction: column; gap: 8px; }
  .hist-row { display: grid; grid-template-columns: 70px 1fr auto; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .hist-row .hist-date { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 0.95rem; }
  .hist-row .hist-date small { display: block; font-size: 0.62rem; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .hist-row .hist-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .hist-row button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; font-size: 0.8rem; }

  /* ---------- Bioimpedância ---------- */

  .history-wrap { display: flex; flex-direction: column; gap: 16px; }
  .hist-chart { width: 100%; height: auto; display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .bio-metric-select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; color: var(--fg); padding: 8px 10px; font-size: 0.84rem; font-family: inherit; }
  .bio-hist-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 0.84rem; }
  .bio-hist-row .bio-val { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bio-hist-row button { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); color: var(--danger); cursor: pointer; font-size: 0.8rem; }
  .ex-form { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
  .ex-form h3 { margin: 0; font-size: 1.1rem; }
  .add-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* ---------- Modal (import) ---------- */

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(10, 9, 7, 0.75);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; max-width: 420px; width: 100%;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .modal-card h3 { margin: 0; font-size: 1.1rem; }
  .modal-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .modal-actions .hint { margin: 0 0 6px; }
  .modal-actions .btn-small { width: 100%; }

  /* ---------- Desktop ---------- */

  @media (min-width: 760px) {
    .app { padding-block: 28px 56px; }
  }
</style>


</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="wordmark">TREINO<span>.</span></div>
    <div class="top-actions">
      <button class="edit-link" id="bioToggle">Bioimpedância</button>
      <button class="edit-link" id="dataToggle">Dados</button>
    </div>
  </div>

  <main id="workoutView"></main>
</div>

<script>
  const DOW_META = [
    { dow: "SEG", full: "Segunda" }, { dow: "TER", full: "Terça" }, { dow: "QUA", full: "Quarta" },
    { dow: "QUI", full: "Quinta" }, { dow: "SEX", full: "Sexta" }, { dow: "SÁB", full: "Sábado" }, { dow: "DOM", full: "Domingo" },
  ];
  const GROUPS = ["Peito", "Costas", "Ombro", "Bíceps", "Tríceps", "Pernas", "Glúteos", "Abdômen", "Cardio", "Outro"];
  const BIO_METRICS = [
    { key: "weight", label: "Peso", unit: "kg" },
    { key: "fatPct", label: "Gordura corporal", unit: "%" },
    { key: "musclePct", label: "Massa muscular", unit: "%" },
    { key: "waterPct", label: "Água corporal", unit: "%" },
    { key: "visceral", label: "Gordura visceral", unit: "" },
    { key: "boneKg", label: "Massa óssea", unit: "kg" },
    { key: "bmr", label: "Taxa metabólica basal", unit: "kcal" },
    { key: "bmi", label: "IMC", unit: "" },
    { key: "armCm", label: "Braço", unit: "cm" },
    { key: "waistCm", label: "Cintura", unit: "cm" },
    { key: "abdomenCm", label: "Abdômen", unit: "cm" },
    { key: "hipCm", label: "Quadril", unit: "cm" },
    { key: "thighCm", label: "Coxa", unit: "cm" },
    { key: "calfCm", label: "Panturrilha", unit: "cm" },
  ];
  const STORE_KEY = "treino-app-v1";

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function escapeAttr(s) { return String(s).replace(/"/g, "&quot;"); }

  function pad2(n) { return String(n).padStart(2, "0"); }
  function toISODate(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function todayISO() { return toISODate(new Date()); }
  function parseISODate(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  // Segunda-feira da semana de "d" (um objeto Date)
  function mondayOf(d) {
    const dow = d.getDay(); // 0=domingo..6=sábado
    const diff = dow === 0 ? -6 : 1 - dow;
    const m = new Date(d);
    m.setDate(d.getDate() + diff);
    m.setHours(0, 0, 0, 0);
    return m;
  }

  function loadStore() {
    let data = null;
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) data = JSON.parse(raw);
    } catch (e) { /* segue vazio */ }
    if (!data || typeof data !== "object") data = {};
    if (!Array.isArray(data.checkins)) data.checkins = [];
    if (!Array.isArray(data.bio)) data.bio = [];
    return data;
  }
  function saveStore() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* sem storage disponível */ }
  }

  const store = loadStore();

  function findCheckin(date) { return store.checkins.find(c => c.date === date); }
  function kindOfTags(tags) {
    if (!tags || !tags.length) return "descanso";
    const onlyCardio = tags.every(t => t === "Cardio");
    return onlyCardio ? "cardio" : "forca";
  }

  // ---------- Estado de navegação ----------

  let weekOffset = 0; // 0 = semana atual
  let selectedDate = todayISO();
  let section = "treino"; // 'treino' | 'bio'
  let checkinFormOpen = false;
  let checkinFormData = null;

  let bioFormOpen = false;
  let bioFormData = null;
  let bioFormError = null;
  let bioChartMetric = "weight";

  const viewEl = document.getElementById("workoutView");

  function weekDates() {
    const base = mondayOf(new Date());
    base.setDate(base.getDate() + weekOffset * 7);
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date(base);
      d.setDate(base.getDate() + i);
      return d;
    });
  }

  function goToWorkout() {
    section = "treino";
    document.getElementById("bioToggle").classList.remove("active");
    document.getElementById("dataToggle").classList.remove("active");
    renderWorkout();
  }

  document.getElementById("bioToggle").addEventListener("click", () => {
    if (section === "bio") { goToWorkout(); return; }
    section = "bio";
    bioFormOpen = false;
    document.getElementById("bioToggle").classList.add("active");
    document.getElementById("dataToggle").classList.remove("active");
    renderBioView();
  });

  document.getElementById("dataToggle").addEventListener("click", () => {
    if (section === "dados") { goToWorkout(); return; }
    section = "dados";
    document.getElementById("bioToggle").classList.remove("active");
    document.getElementById("dataToggle").classList.add("active");
    renderDataView();
  });

  // ---------- Tela principal (semana + check-in do dia) ----------

  function renderWorkout() {
    const dates = weekDates();
    const todayStr = todayISO();
    if (!dates.some(d => toISODate(d) === selectedDate)) selectedDate = toISODate(dates[0]);

    const railHtml = dates.map((d, i) => {
      const iso = toISODate(d);
      const c = findCheckin(iso);
      const kind = c ? kindOfTags(c.tags) : "descanso";
      const future = iso > todayStr;
      const selected = iso === selectedDate;
      return `
        <button type="button" class="day-pill" data-kind="${kind}" data-future="${future}" aria-selected="${selected}" data-date="${iso}">
          <span class="dow">${DOW_META[i].dow}</span>
          <span class="dnum">${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}</span>
          <span class="dot"></span>
        </button>
      `;
    }).join("");

    const weekLabel = `${pad2(dates[0].getDate())}/${pad2(dates[0].getMonth() + 1)} – ${pad2(dates[6].getDate())}/${pad2(dates[6].getMonth() + 1)}` + (weekOffset === 0 ? " · essa semana" : "");

    const trainedCount = dates.filter(d => { const c = findCheckin(toISODate(d)); return c && kindOfTags(c.tags) === "forca"; }).length;
    const cardioCount = dates.filter(d => { const c = findCheckin(toISODate(d)); return c && kindOfTags(c.tags) === "cardio"; }).length;
    const restCount = 7 - trainedCount - cardioCount;

    viewEl.innerHTML = `
      <div class="week-nav">
        <button type="button" id="weekPrev" title="Semana anterior">⟵</button>
        <span class="week-label">${weekLabel}</span>
        <button type="button" id="weekNext" ${weekOffset >= 0 ? "disabled" : ""} title="Próxima semana">⟶</button>
      </div>
      <div class="day-rail" id="dayRail">${railHtml}</div>

      <div class="stats-row">
        <div><div class="stat-num" style="color:var(--accent)">${trainedCount}</div><div class="stat-lbl">Musculação</div></div>
        <div><div class="stat-num" style="color:var(--cardio)">${cardioCount}</div><div class="stat-lbl">Cardio</div></div>
        <div><div class="stat-num" style="color:var(--muted)">${restCount}</div><div class="stat-lbl">Descanso</div></div>
      </div>

      <div id="dayPanel"></div>

      <div class="section-label">Histórico recente</div>
      <div class="hist-list" id="histList"></div>
    `;

    document.getElementById("weekPrev").addEventListener("click", () => { weekOffset -= 1; renderWorkout(); });
    document.getElementById("weekNext").addEventListener("click", () => { if (weekOffset < 0) { weekOffset += 1; renderWorkout(); } });
    document.querySelectorAll(".day-pill").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.dataset.future === "true") return;
        selectedDate = btn.dataset.date;
        checkinFormOpen = false;
        renderDayPanel();
        document.querySelectorAll(".day-pill").forEach(b => b.setAttribute("aria-selected", b.dataset.date === selectedDate ? "true" : "false"));
      });
    });

    renderDayPanel();
    renderHistList();
  }

  function dayLabelFor(iso) {
    const d = parseISODate(iso);
    let dow = d.getDay(); dow = dow === 0 ? 6 : dow - 1;
    return DOW_META[dow].full + " · " + pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1);
  }

  function renderDayPanel() {
    const panel = document.getElementById("dayPanel");
    if (!panel) return;
    const iso = selectedDate;
    const todayStr = todayISO();
    const isFuture = iso > todayStr;
    const c = findCheckin(iso);

    if (isFuture) {
      panel.innerHTML = `<div class="rest-card"><div class="display">${escapeHtml(dayLabelFor(iso))}</div>Esse dia ainda não chegou.</div>`;
      return;
    }

    if (checkinFormOpen) {
      panel.innerHTML = checkinFormHTML();
      wireCheckinForm();
      return;
    }

    if (!c) {
      panel.innerHTML = `
        <div class="checkin-card">
          <div class="workout-head" style="margin-bottom:0">
            <div><h1>${escapeHtml(dayLabelFor(iso))}</h1><div class="meta">Nenhum treino registrado</div></div>
            <span class="badge descanso">Livre</span>
          </div>
          <button type="button" class="btn-small primary" id="openCheckinBtn">+ Registrar treino</button>
        </div>
      `;
      document.getElementById("openCheckinBtn").addEventListener("click", () => { openCheckinForm(iso); });
      return;
    }

    const kind = kindOfTags(c.tags);
    panel.innerHTML = `
      <div class="checkin-card">
        <div class="workout-head" style="margin-bottom:0">
          <div><h1>${escapeHtml(dayLabelFor(iso))}</h1></div>
          <span class="badge ${kind}">${kind === "cardio" ? "Cardio" : "Musculação"}</span>
        </div>
        <div class="checkin-view">
          <div class="checkin-tags">${c.tags.map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join("")}</div>
          ${c.duration ? `<div class="checkin-meta-row"><span>⏱ ${c.duration} min</span></div>` : ""}
          ${c.note ? `<div class="checkin-note">${escapeHtml(c.note)}</div>` : ""}
        </div>
        <div class="form-actions" style="justify-content:flex-start">
          <button type="button" class="btn-small" id="editCheckinBtn">Editar</button>
          <button type="button" class="btn-small danger" id="deleteCheckinBtn">Excluir</button>
        </div>
      </div>
    `;
    document.getElementById("editCheckinBtn").addEventListener("click", () => openCheckinForm(iso));
    document.getElementById("deleteCheckinBtn").addEventListener("click", () => {
      store.checkins = store.checkins.filter(x => x.date !== iso);
      saveStore();
      renderWorkout();
    });
  }

  function openCheckinForm(iso) {
    const existing = findCheckin(iso);
    checkinFormData = existing
      ? { date: iso, tags: existing.tags.slice(), note: existing.note || "", duration: existing.duration || "" }
      : { date: iso, tags: [], note: "", duration: "" };
    checkinFormOpen = true;
    renderDayPanel();
  }

  function checkinFormHTML() {
    const d = checkinFormData;
    const chips = GROUPS.map(g => `
      <button type="button" class="chip ${g === "Cardio" ? "cardio-chip" : ""} ${d.tags.includes(g) ? "selected" : ""}" data-tag="${escapeAttr(g)}">${escapeHtml(g)}</button>
    `).join("");
    return `
      <div class="ex-form">
        <h3>${escapeHtml(dayLabelFor(d.date))}</h3>
        <div class="form-row">
          <label>O que você treinou?</label>
          <div class="chip-grid" id="tagChips">${chips}</div>
        </div>
        <div class="form-grid">
          <div class="form-row"><label>Duração (min, opcional)</label><input type="number" id="ckDuration" min="0" value="${escapeAttr(d.duration)}"></div>
        </div>
        <div class="form-row"><label>Nota (opcional)</label><textarea id="ckNote">${escapeHtml(d.note)}</textarea></div>
        <p class="hint" id="ckError" style="color:var(--danger);display:none"></p>
        <div class="form-actions">
          <button type="button" class="btn-small" id="ckCancel">Cancelar</button>
          <button type="button" class="btn-small primary" id="ckSave">Salvar</button>
        </div>
      </div>
    `;
  }

  function wireCheckinForm() {
    document.querySelectorAll("#tagChips .chip").forEach(chip => {
      chip.addEventListener("click", () => {
        const tag = chip.dataset.tag;
        const idx = checkinFormData.tags.indexOf(tag);
        if (idx >= 0) checkinFormData.tags.splice(idx, 1); else checkinFormData.tags.push(tag);
        chip.classList.toggle("selected");
      });
    });
    document.getElementById("ckCancel").addEventListener("click", () => { checkinFormOpen = false; renderDayPanel(); });
    document.getElementById("ckSave").addEventListener("click", () => {
      const note = document.getElementById("ckNote").value.trim();
      const durationRaw = document.getElementById("ckDuration").value;
      const duration = durationRaw === "" ? null : Math.max(0, parseInt(durationRaw, 10) || 0);
      if (!checkinFormData.tags.length) {
        const err = document.getElementById("ckError");
        err.textContent = "Escolha pelo menos um grupo muscular ou Cardio.";
        err.style.display = "block";
        return;
      }
      const entry = { date: checkinFormData.date, tags: checkinFormData.tags.slice(), note, duration };
      const idx = store.checkins.findIndex(c => c.date === entry.date);
      if (idx >= 0) store.checkins[idx] = entry; else store.checkins.push(entry);
      store.checkins.sort((a, b) => a.date.localeCompare(b.date));
      saveStore();
      checkinFormOpen = false;
      renderWorkout();
    });
  }

  function renderHistList() {
    const list = document.getElementById("histList");
    if (!list) return;
    const entries = store.checkins.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 15);
    if (!entries.length) {
      list.innerHTML = `<p class="hint">Nenhum treino registrado ainda.</p>`;
      return;
    }
    list.innerHTML = entries.map(c => {
      const d = parseISODate(c.date);
      return `
        <div class="hist-row">
          <div class="hist-date">${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}<small>${["DOM","SEG","TER","QUA","QUI","SEX","SÁB"][d.getDay()]}</small></div>
          <div class="hist-tags">${c.tags.map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join("")}</div>
          <button type="button" title="Editar" data-hist-date="${c.date}">✎</button>
        </div>
      `;
    }).join("");
    list.querySelectorAll("button[data-hist-date]").forEach(btn => {
      btn.addEventListener("click", () => {
        const iso = btn.dataset.histDate;
        const dates = weekDates();
        const inWeek = dates.some(d => toISODate(d) === iso);
        if (!inWeek) {
          const target = parseISODate(iso);
          const diffWeeks = Math.round((mondayOf(target) - mondayOf(new Date())) / (7 * 86400000));
          weekOffset = diffWeeks;
        }
        selectedDate = iso;
        checkinFormOpen = false;
        renderWorkout();
      });
    });
  }

  // ---------- Bioimpedância ----------

  function openBioForm(date) {
    if (date) {
      const e = store.bio.find(b => b.date === date);
      bioFormData = Object.assign({ __editing: true }, e);
    } else {
      bioFormData = {
        __editing: false, date: todayISO(), weight: "", fatPct: "", musclePct: "", waterPct: "", visceral: "", boneKg: "", bmr: "", bmi: "",
        armCm: "", waistCm: "", abdomenCm: "", hipCm: "", thighCm: "", calfCm: "",
      };
    }
    bioFormOpen = true;
    bioFormError = null;
    renderBioView();
  }
  function cancelBioForm() { bioFormOpen = false; bioFormError = null; renderBioView(); }
  function bioField(field, value) { bioFormData[field] = value; }
  function saveBioForm() {
    if (!bioFormData.date) { bioFormError = "Informe a data."; renderBioView(); return; }
    if (bioFormData.weight === "" || bioFormData.weight == null || isNaN(parseFloat(bioFormData.weight))) {
      bioFormError = "Informe ao menos o peso."; renderBioView(); return;
    }
    const num = v => (v === "" || v == null || isNaN(parseFloat(v))) ? null : parseFloat(v);
    const entry = {
      date: bioFormData.date, weight: num(bioFormData.weight), fatPct: num(bioFormData.fatPct),
      musclePct: num(bioFormData.musclePct), waterPct: num(bioFormData.waterPct), visceral: num(bioFormData.visceral),
      boneKg: num(bioFormData.boneKg), bmr: num(bioFormData.bmr), bmi: num(bioFormData.bmi),
      armCm: num(bioFormData.armCm), waistCm: num(bioFormData.waistCm), abdomenCm: num(bioFormData.abdomenCm),
      hipCm: num(bioFormData.hipCm), thighCm: num(bioFormData.thighCm), calfCm: num(bioFormData.calfCm),
    };
    const idx = store.bio.findIndex(b => b.date === entry.date);
    if (idx >= 0) store.bio[idx] = entry; else store.bio.push(entry);
    store.bio.sort((a, b) => a.date.localeCompare(b.date));
    saveStore();
    bioFormOpen = false;
    bioFormError = null;
    renderBioView();
  }
  function deleteBioEntry(date) {
    store.bio = store.bio.filter(b => b.date !== date);
    saveStore();
    renderBioView();
  }

  function bioFormHTML() {
    const d = bioFormData;
    const field = (key, label, step) => `
      <div class="form-row">
        <label>${label}</label>
        <input type="number" step="${step}" value="${d[key] ?? ""}" oninput="bioField('${key}', this.value)">
      </div>
    `;
    return `
      <div class="ex-form">
        <h3>${d.__editing ? "Editar medição" : "Nova medição"}</h3>
        ${bioFormError ? `<p class="hint" style="color:var(--danger)">${escapeHtml(bioFormError)}</p>` : ""}
        <div class="form-grid">
          <div class="form-row"><label>Data</label><input type="date" value="${escapeAttr(d.date)}" oninput="bioField('date', this.value)"></div>
          ${field("weight", "Peso (kg)", "0.1")}
          ${field("fatPct", "Gordura corporal (%)", "0.1")}
          ${field("musclePct", "Massa muscular (%)", "0.1")}
          ${field("waterPct", "Água corporal (%)", "0.1")}
          ${field("visceral", "Gordura visceral", "1")}
          ${field("boneKg", "Massa óssea (kg)", "0.1")}
          ${field("bmr", "Taxa metabólica basal (kcal)", "1")}
          ${field("bmi", "IMC", "0.1")}
        </div>
        <div class="section-label" style="margin:4px 0 0">Medidas (fita métrica)</div>
        <div class="form-grid">
          ${field("armCm", "Braço (cm)", "0.5")}
          ${field("waistCm", "Cintura (cm)", "0.5")}
          ${field("abdomenCm", "Abdômen (cm)", "0.5")}
          ${field("hipCm", "Quadril (cm)", "0.5")}
          ${field("thighCm", "Coxa (cm)", "0.5")}
          ${field("calfCm", "Panturrilha (cm)", "0.5")}
        </div>
        <p class="hint">Só data e peso são obrigatórios — preencha o resto conforme sua balança/fita mostrar.</p>
        <div class="form-actions">
          <button type="button" class="btn-small" onclick="cancelBioForm()">Cancelar</button>
          <button type="button" class="btn-small primary" onclick="saveBioForm()">Salvar medição</button>
        </div>
      </div>
    `;
  }

  function drawLineChart(points, unit) {
    const w = 640, h = 220, padL = 40, padR = 14, padT = 14, padB = 28;
    if (!points.length) return `<svg class="hist-chart" viewBox="0 0 ${w} ${h}"><text x="${w/2}" y="${h/2}" fill="#9c9284" font-size="13" text-anchor="middle">Sem registros ainda</text></svg>`;
    const values = points.map(p => p.value);
    let min = Math.min(...values), max = Math.max(...values);
    if (min === max) { min -= 1; max += 1; }
    const pad = (max - min) * 0.1;
    min -= pad; max += pad;
    const x = i => padL + (i / Math.max(1, points.length - 1)) * (w - padL - padR);
    const y = v => padT + (1 - (v - min) / (max - min)) * (h - padT - padB);
    const path = points.map((p, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
    const dots = points.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="3.5" fill="#e8542c"></circle>`).join("");
    const first = points[0], last = points[points.length - 1];
    const labelFirst = parseISODate(first.date);
    const labelLast = parseISODate(last.date);
    return `
      <svg class="hist-chart" viewBox="0 0 ${w} ${h}">
        <line x1="${padL}" y1="${(h-padB).toFixed(1)}" x2="${w-padR}" y2="${(h-padB).toFixed(1)}" stroke="#3a352c" stroke-width="1"></line>
        <text x="${padL}" y="${(h-8).toFixed(1)}" fill="#9c9284" font-size="11">${pad2(labelFirst.getDate())}/${pad2(labelFirst.getMonth()+1)}</text>
        <text x="${w-padR}" y="${(h-8).toFixed(1)}" fill="#9c9284" font-size="11" text-anchor="end">${pad2(labelLast.getDate())}/${pad2(labelLast.getMonth()+1)}</text>
        <text x="${padL-6}" y="${y(max).toFixed(1)}" fill="#9c9284" font-size="11" text-anchor="end">${max.toFixed(1)}${unit}</text>
        <text x="${padL-6}" y="${y(min).toFixed(1)}" fill="#9c9284" font-size="11" text-anchor="end">${min.toFixed(1)}${unit}</text>
        <path d="${path}" fill="none" stroke="#e8542c" stroke-width="2"></path>
        ${dots}
      </svg>
    `;
  }

  function renderBioView() {
    const entries = store.bio.slice().sort((a, b) => a.date.localeCompare(b.date));
    const metricMeta = BIO_METRICS.find(m => m.key === bioChartMetric);
    const points = entries.filter(e => e[bioChartMetric] != null).map(e => ({ date: e.date, value: e[bioChartMetric] }));

    viewEl.innerHTML = `
      <div class="history-wrap">
        <button type="button" class="link-btn" onclick="goToWorkout()" style="align-self:flex-start">← Voltar pro treino</button>
        <div class="workout-head">
          <div><h1>Bioimpedância</h1><div class="meta">${entries.length} registro${entries.length !== 1 ? "s" : ""}</div></div>
        </div>

        ${bioFormOpen ? bioFormHTML() : `<button type="button" class="btn-small primary" onclick="openBioForm(null)">+ Nova medição</button>`}

        ${entries.length ? `
          <div class="add-row" style="margin-top:4px">
            <label style="font-size:.78rem;color:var(--muted)">Ver evolução de:</label>
            <select class="bio-metric-select" id="bioMetricSelect">
              ${BIO_METRICS.map(m => `<option value="${m.key}" ${m.key === bioChartMetric ? "selected" : ""}>${m.label}</option>`).join("")}
            </select>
          </div>
          ${drawLineChart(points, metricMeta.unit)}
          <div class="section-label">Registros</div>
          <div class="hist-list">
            ${entries.slice().reverse().map(e => {
              const d = parseISODate(e.date);
              const val = e[bioChartMetric];
              return `
                <div class="bio-hist-row">
                  <span>${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}</span>
                  <span class="bio-val">${val != null ? val + metricMeta.unit : "—"}</span>
                  <span style="display:flex;gap:6px">
                    <button type="button" title="Editar" onclick="openBioForm('${e.date}')">✎</button>
                    <button type="button" title="Excluir" onclick="deleteBioEntry('${e.date}')">×</button>
                  </span>
                </div>
              `;
            }).join("")}
          </div>
        ` : `<div class="rest-card"><div class="display">Sem registros ainda</div>Clique em "+ Nova medição" pra começar a acompanhar.</div>`}
      </div>
    `;
    const sel = document.getElementById("bioMetricSelect");
    if (sel) sel.addEventListener("change", () => { bioChartMetric = sel.value; renderBioView(); });
  }

  // ---------- Dados (export/import) ----------

  function renderDataView() {
    const ckCount = store.checkins.length;
    const bioCount = store.bio.length;
    viewEl.innerHTML = `
      <div class="history-wrap">
        <button type="button" class="link-btn" onclick="goToWorkout()" style="align-self:flex-start">← Voltar pro treino</button>
        <div class="workout-head"><div><h1>Dados</h1><div class="meta">Backup e sincronização entre aparelhos</div></div></div>
        <div class="ex-form">
          <h3>Exportar dados</h3>
          <p class="hint">Gera um arquivo com tudo que está salvo neste aparelho: ${ckCount} treinos registrados e ${bioCount} registros de bioimpedância. Envie esse arquivo para o outro aparelho (WhatsApp, e-mail etc.) e importe lá.</p>
          <div class="form-actions"><button class="btn-small primary" onclick="exportData()">Exportar dados (.json)</button></div>
        </div>
        <div class="ex-form">
          <h3>Importar dados</h3>
          <p class="hint">Selecione um arquivo exportado por este app. Depois você escolhe se quer <strong>mesclar</strong> (mantém o que já está salvo aqui) ou <strong>substituir tudo</strong> pelo conteúdo do arquivo.</p>
          <div class="form-actions">
            <label class="btn-small" for="importFileInput" style="cursor:pointer;">Escolher arquivo</label>
            <input type="file" id="importFileInput" accept="application/json" style="display:none" onchange="handleImportFile(this)">
          </div>
        </div>
      </div>
    `;
  }

  async function exportData() {
    const payload = { app: "treino-app", version: 2, exportedAt: new Date().toISOString(), store };
    const json = JSON.stringify(payload, null, 2);
    const stamp = todayISO();
    const filename = `treino-dados-${stamp}.json`;
    try {
      if (window.claude && typeof window.claude.use === "function") {
        const downloads = await window.claude.use("downloads");
        if (downloads) { await downloads.save({ filename, data: json }); return; }
      }
    } catch (e) { /* fallback */ }
    try {
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e) { alert("Não foi possível exportar o arquivo neste navegador."); }
  }

  function handleImportFile(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(String(reader.result)); } catch (e) { parsed = null; }
      const incoming = parsed && parsed.store ? parsed.store : parsed;
      if (!incoming || (!Array.isArray(incoming.checkins) && !Array.isArray(incoming.bio))) {
        alert("Arquivo inválido. Selecione um arquivo de dados exportado por este app.");
        input.value = "";
        return;
      }
      if (!Array.isArray(incoming.checkins)) incoming.checkins = [];
      if (!Array.isArray(incoming.bio)) incoming.bio = [];
      input.value = "";
      openImportChoiceModal(incoming);
    };
    reader.onerror = () => { alert("Não foi possível ler o arquivo selecionado."); input.value = ""; };
    reader.readAsText(file);
  }

  function importModalKeyHandler(e) { if (e.key === "Escape") closeImportChoiceModal(); }
  function closeImportChoiceModal() {
    const el = document.getElementById("importModalBackdrop");
    if (el) el.remove();
    document.removeEventListener("keydown", importModalKeyHandler);
  }
  function openImportChoiceModal(incoming) {
    closeImportChoiceModal();
    const el = document.createElement("div");
    el.className = "modal-backdrop";
    el.id = "importModalBackdrop";
    el.innerHTML = `
      <div class="modal-card">
        <h3>Como importar este arquivo?</h3>
        <p class="hint">O arquivo tem ${incoming.checkins.length} treinos registrados e ${incoming.bio.length} registros de bioimpedância.</p>
        <div class="modal-actions">
          <button class="btn-small primary" id="importMergeBtn">Mesclar dados (recomendado)</button>
          <p class="hint">Mantém o que já está salvo neste aparelho e acrescenta/atualiza com o que está no arquivo.</p>
          <button class="btn-small" id="importReplaceBtn">Substituir tudo</button>
          <p class="hint">Apaga tudo que está salvo neste aparelho e usa só o que está no arquivo. Essa ação não pode ser desfeita.</p>
          <button class="link-btn" id="importCancelBtn">Cancelar</button>
        </div>
      </div>
    `;
    document.body.appendChild(el);
    el.addEventListener("click", (e) => { if (e.target === el) closeImportChoiceModal(); });
    document.getElementById("importMergeBtn").addEventListener("click", () => { closeImportChoiceModal(); applyImportedStore(incoming, "merge"); });
    document.getElementById("importReplaceBtn").addEventListener("click", () => {
      closeImportChoiceModal();
      const ok = confirm("Substituir tudo vai apagar TODOS os treinos e bioimpedância salvos neste aparelho, usando só o que está no arquivo importado. Essa ação não pode ser desfeita. Deseja continuar?");
      if (ok) applyImportedStore(incoming, "replace");
    });
    document.getElementById("importCancelBtn").addEventListener("click", closeImportChoiceModal);
    document.addEventListener("keydown", importModalKeyHandler);
  }

  function mergeByDate(local, incoming) {
    const map = new Map();
    (Array.isArray(local) ? local : []).forEach(x => { if (x && x.date) map.set(x.date, x); });
    (Array.isArray(incoming) ? incoming : []).forEach(x => { if (x && x.date) map.set(x.date, x); });
    return Array.from(map.values()).sort((a, b) => a.date.localeCompare(b.date));
  }

  function applyImportedStore(incoming, mode) {
    if (mode === "merge") {
      store.checkins = mergeByDate(store.checkins, incoming.checkins);
      store.bio = mergeByDate(store.bio, incoming.bio);
    } else {
      store.checkins = Array.isArray(incoming.checkins) ? incoming.checkins.slice() : [];
      store.bio = Array.isArray(incoming.bio) ? incoming.bio.slice() : [];
    }
    saveStore();
    alert(mode === "merge" ? "Dados mesclados com sucesso!" : "Dados importados com sucesso!");
    goToWorkout();
  }

  // ---------- Início ----------
  renderWorkout();
</script>

</body>
</html>
